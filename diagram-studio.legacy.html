        setHint("Opened " + file.name + ".");
      } catch (err) {
        setHint("That file could not be read as a diagram.");
      }
    };

    reader.readAsText(file);
    event.target.value = "";
  });

  document.getElementById("btnNew").addEventListener("click", function () {
    stopReveal();
    nodes = [];
    edges = [];
    texts = [];
    selected = null;
    render();
    setHint("Blank canvas. Pick a tool on the left.");
  });

  document.getElementById("rough").addEventListener("change", function (event) {
    roughness = event.currentTarget.value;
    buildFilters();
    render();
  });

  document.getElementById("btnTexture").addEventListener("click", function (event) {
    textureOn = !textureOn;
    pressToggle(event.currentTarget, textureOn);
    document.body.classList.toggle("no-texture", !textureOn);
  });

  document.getElementById("btnSnap").addEventListener("click", function (event) {
    snapOn = !snapOn;
    pressToggle(event.currentTarget, snapOn);
  });

  document.getElementById("btnGrid").addEventListener("click", function (event) {
    gridOn = !gridOn;
    pressToggle(event.currentTarget, gridOn);
    document.getElementById("gridRect").setAttribute("opacity", gridOn ? 1 : 0);
  });

  // ===============================================================
  // 16. Example diagram
  // ===============================================================

  function loadExample() {
    stopReveal();

    nodes = [
      { id: "a", type: "box", style: "wash", x: 60, y: 90, w: 170, h: 54,
        fill: "#C3DDF4", accent: "#6FA9DB", filled: true,
        title: "Source systems", sub: "SIS, assessment, LMS", titleSize: 11.5, titleColor: INK },
      { id: "b", type: "box", style: "wash", x: 60, y: 210, w: 170, h: 54,
        fill: "#C3DDF4", accent: "#6FA9DB", filled: true,
        title: "Airflow ingest", sub: "one task per source", titleSize: 11.5, titleColor: INK },
      { id: "c", type: "box", style: "wash", x: 60, y: 330, w: 170, h: 54,
        fill: "#C3DDF4", accent: "#6FA9DB", filled: true,
        title: "Snowflake raw", sub: "loaded with copy into", titleSize: 11.5, titleColor: INK },
      { id: "d", type: "box", style: "sketch", x: 60, y: 450, w: 170, h: 54,
        fill: "#AFCDCB", accent: "#2E7A7B", filled: true,
        title: "dbt build", sub: "staging to marts", titleSize: 11.5, titleColor: INK },
      { id: "e", type: "diamond", style: "wash", x: 330, y: 435, w: 160, h: 88,
        fill: "#F3CBC0", accent: "#DD4B44", filled: true,
        title: "Tests pass?", sub: "", titleSize: 11.5, titleColor: INK },
      { id: "f", type: "box", style: "wash", x: 580, y: 450, w: 170, h: 54,
        fill: "#F8DFA3", accent: "#EFB13A", filled: true,
        title: "Dashboards", sub: "published to districts", titleSize: 11.5, titleColor: INK },
      { id: "g", type: "box", style: "wash", x: 570, y: 290, w: 170, h: 54,
        fill: "#FFFFFF", accent: "#DD4B44", filled: false,
        title: "Alert on-call", sub: "halt the DAG", titleSize: 11.5, titleColor: RED }
    ];

    edges = [
      { id: "e1", from: "a", to: "b", fromSide: "bottom", toSide: "top", color: LINE,
        weight: 1.6, dashed: false, label: "", onPath: true, shape: "curve", detour: 0, labelSize: 9.5 },
      { id: "e2", from: "b", to: "c", fromSide: "bottom", toSide: "top", color: LINE,
        weight: 1.6, dashed: false, label: "", onPath: true, shape: "curve", detour: 0, labelSize: 9.5 },
      { id: "e3", from: "c", to: "d", fromSide: "bottom", toSide: "top", color: LINE,
        weight: 1.6, dashed: false, label: "", onPath: true, shape: "curve", detour: 0, labelSize: 9.5 },
      { id: "e4", from: "d", to: "e", fromSide: "right", toSide: "left", color: LINE,
        weight: 1.6, dashed: false, label: "", onPath: true, shape: "curve", detour: 0, labelSize: 9.5 },
      { id: "e5", from: "e", to: "f", fromSide: "right", toSide: "left", color: LINE,
        weight: 1.6, dashed: false, label: "pass", onPath: true, shape: "curve", detour: 0, labelSize: 9.5 },
      { id: "e6", from: "e", to: "g", fromSide: "top", toSide: "left", color: RED,
        weight: 1.6, dashed: false, label: "fail", onPath: true, shape: "curve", detour: 0, labelSize: 9.5 },
      { id: "e7", from: "g", to: "d", fromSide: "left", toSide: "right", color: RED,
        weight: 1.6, dashed: true, label: "retry after fix", onPath: true,
        shape: "elbow", detour: -120, labelSize: 9.5 }
    ];

    texts = [
      { id: "t1", x: 145, y: 52, text: "Nightly pipeline run", size: 16, weight: 600,
        color: INK, anchor: "middle", bold: true, italic: false, strike: false, underline: false }
    ];

    selected = null;
    nextId = 100;
    render();
    setHint("Drag empty space to pan, scroll to zoom, double click a shape to type.");
  }

  buildRail();
  buildFilters();
  loadExample();
  setTool("select");
})();
</script>
